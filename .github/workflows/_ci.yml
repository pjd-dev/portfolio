name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install -w

      - name: Build all workspaces
        run: pnpm run build

      - name: Run Vitest across workspaces
        run: pnpm test

      - name: Run lint (if present)
        run: pnpm run lint --if-present

      - name: Typecheck (if present)
        run: pnpm run typecheck --if-present
